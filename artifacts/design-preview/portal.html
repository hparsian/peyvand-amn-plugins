<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مراجع — پیش‌نمایش</title>
<link rel="stylesheet" href="assets/fonts/vazirmatn/vazirmatn.css">
<link rel="stylesheet" href="assets/fonts/plex-arabic/plex-arabic.css">
<link rel="stylesheet" href="assets/panel.css">
<link rel="stylesheet" href="assets/panel-skin.css">
<link rel="stylesheet" href="assets/panel-v2.css">
<style>html,body{margin:0;background:#F4F1EC;}</style>
</head>
<body>
<div class="zdp-panel zdp-panel-shell" dir="rtl">

  <header class="zdp-shell-topbar">
    <div class="zdp-shell-brand">
      <span class="zdp-shell-brand-mark" aria-hidden="true">
        <span class="zdp-ring zdp-ring-a"></span>
        <span class="zdp-ring zdp-ring-b"></span>
      </span>
      <span class="zdp-shell-brand-name">پیوند امن</span>
    </div>
    <div class="zdp-shell-user">
      <span class="zdp-shell-user-avatar" aria-hidden="true">م</span>
      <span class="zdp-shell-user-info">
        <strong class="zdp-shell-user-name">مریم رضایی</strong>
        <span class="zdp-shell-user-mobile" dir="ltr">۰۹۱۲۱۲۳۴۵۶۷</span>
      </span>
      <a href="#" class="zdp-logout">
        <span class="zdp-shell-logout-label">خروج</span>
      </a>
    </div>
  </header>

  <nav class="zdp-tabs" role="tablist">
    <button type="button" class="zdp-tab active" role="tab" aria-selected="true"><span class="zdp-tab-label">نوبت‌ها</span></button>
    <button type="button" class="zdp-tab" role="tab" aria-selected="false"><span class="zdp-tab-label">آزمون‌ها</span><span class="zdp-tab-badge">۲</span></button>
    <button type="button" class="zdp-tab" role="tab" aria-selected="false"><span class="zdp-tab-label">پیام‌ها</span></button>
    <button type="button" class="zdp-tab" role="tab" aria-selected="false"><span class="zdp-tab-label">فرم ارزیابی مراجع</span><span class="zdp-tab-badge">!</span></button>
    <button type="button" class="zdp-tab" role="tab" aria-selected="false"><span class="zdp-tab-label">نظرسنجی</span></button>
  </nav>

  <div class="zdp-shell-main">
    <div class="zdp-stats-grid">
      <div class="zdp-stat-card zdp-stat-card-highlight">
        <span class="zdp-stat-label">نوبت بعدی شما</span>
        <strong class="zdp-stat-value">مشاورهٔ فردی</strong>
        <span class="zdp-stat-sub">۱۴۰۵/۰۸/۲۹ — ساعت ۱۶:۳۰</span>
        <span class="zdp-status">تایید شده</span>
      </div>
      <div class="zdp-stat-card">
        <span class="zdp-stat-label">آزمون‌های در انتظار</span>
        <strong class="zdp-stat-value">۲</strong>
      </div>
      <div class="zdp-stat-card">
        <span class="zdp-stat-label">پیام‌های ثبت‌شده</span>
        <strong class="zdp-stat-value">۵</strong>
      </div>
    </div>

    <section class="zdp-tab-panel">
      <h2 style="margin:0 0 10px;font-size:1rem">نوبت‌های شما</h2>
      <p class="description" style="margin:0 0 16px;color:#5C615D;font-size:.8125rem">برای رزرو وقت جدید از دکمهٔ زیر استفاده کنید.</p>
      <button type="button" class="zdp-btn">رزرو نوبت جدید</button>
      <table style="width:100%;margin-top:18px;border-collapse:collapse;font-size:.8125rem">
        <thead>
          <tr style="color:#7A7F79;font-size:11px">
            <th style="text-align:start;padding:8px 10px;border-bottom:1px solid #DCD5C9">تاریخ</th>
            <th style="text-align:start;padding:8px 10px;border-bottom:1px solid #DCD5C9">خدمت</th>
            <th style="text-align:start;padding:8px 10px;border-bottom:1px solid #DCD5C9">وضعیت</th>
          </tr>
        </thead>
        <tbody>
          <tr><td style="padding:9px 10px;border-bottom:1px solid #E8E2D8">۱۴۰۵/۰۸/۲۹ — ۱۶:۳۰</td><td style="padding:9px 10px;border-bottom:1px solid #E8E2D8">مشاورهٔ فردی</td><td style="padding:9px 10px;border-bottom:1px solid #E8E2D8"><span class="zdp-status">تایید شده</span></td></tr>
          <tr><td style="padding:9px 10px">۱۴۰۵/۰۸/۱۵ — ۱۰:۰۰</td><td style="padding:9px 10px">مشاورهٔ فردی</td><td style="padding:9px 10px"><span class="zdp-status zdp-status-cancelled">لغو شده</span></td></tr>
        </tbody>
      </table>
    </section>
  </div>
</div>
</body>
</html>
